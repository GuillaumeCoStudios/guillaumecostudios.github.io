<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the game</title>
<!-- #185: the lobby QR lands here ONLY when the app is not installed
     (an installed app takes the App Link before any HTTP happens). Forward to
     Play with the table code as install referrer; the app reads it back after
     install and drops the new player into that table. Static, no server. -->
<style>
  body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;text-align:center}
  main{padding:2rem}
  a{display:inline-block;margin-top:1rem;padding:1rem 1.5rem;border-radius:999px;background:#ffd400;color:#111;font-weight:800;text-decoration:none;font-size:1.1rem}
  p{opacity:.8}
</style>
<main>
  <h1>Join the game</h1>
  <p id="msg">Get the app, then you are in.</p>
  <a id="go" href="https://play.google.com/store/apps/details?id=com.guillaumeandco.ultimategamebuzzer">Get Ultimate Game Buzzer</a>
</main>
<script>
(function () {
  var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var play = 'https://play.google.com/store/apps/details?id=com.guillaumeandco.ultimategamebuzzer'
    + (code ? '&referrer=' + encodeURIComponent('code=' + code) : '');
  var go = document.getElementById('go');
  go.href = play;
  if (code) document.getElementById('msg').textContent = 'Table ' + code + '. Get the app, then you are in.';
  if (/android/i.test(navigator.userAgent)) location.replace(play);
})();
</script>
